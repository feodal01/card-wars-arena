# Reconstructed from the recorded settings and the human table configuration.
[engine]
project = "${CARDWARS_UNITY_PROJECT}"

[match]
rules_version = "cardwars-v3-en"
games = 5
players = ["human", "terra"]
seed = 4912492054819967648
pool = "no_obsidian"
placement = "before_cards"
health = 100
watch = false
record = true

[harnesses.codex]
adapter = "codex"
