<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Match trace · Card Wars Arena</title><style>:root {
  --ink: #202c34;
  --muted: #57666b;
  --border: #cfd8d4;
  --paper: #f2f4ef;
  --white: #fff;
  --green: #146654;
  --mint: #d6ede1;
  --plum: #84486f;
  --gold: #ffcd64;
  color: var(--ink);
  font:
    14px/1.45 -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--paper);
}
button,
input,
select {
  font: inherit;
  color: inherit;
}
button,
select {
  cursor: pointer;
}
button:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 3px solid #1786a6;
  outline-offset: 2px;
}
.shell {
  max-width: 1440px;
  margin: auto;
  padding: 0 clamp(12px, 3.4vw, 52px);
}
header {
  background: #162e2e;
  color: white;
}
.mast {
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.mast b {
  letter-spacing: 0.09em;
  font-size: 13px;
}
.emblem {
  font-size: 23px;
  color: #acd9b1;
  margin-right: 6px;
}
.mast > span,
.slash {
  color: #accbc1;
}
.slash {
  margin: 0 6px;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1 {
  font-size: clamp(24px, 3.4vw, 46px);
  letter-spacing: -0.06em;
  font-weight: 650;
}
h2 {
  font-size: 20px;
  letter-spacing: -0.03em;
}
h3 {
  font-size: 14px;
  margin: 18px 0 8px;
}
.kicker {
  font:
    700 11px/1.5 ui-monospace,
    monospace;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--green);
}
#overview {
  padding: 27px 0 19px;
}
.summary {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 20px;
}
.score {
  color: var(--green);
  padding: 0 0.18em;
  font-variant-numeric: tabular-nums;
}
.sub,
.meta,
small,
footer {
  color: var(--muted);
}
.sub {
  margin-top: 5px;
}
.privacy {
  display: inline-block;
  border: 1px solid #a7bbb2;
  border-radius: 100px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 650;
}
#games {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin: 0 0 18px;
}
.game {
  flex: 1;
  min-width: 120px;
  background: #fafbf7;
  border: 1px solid var(--border);
  border-radius: 7px;
  text-align: left;
  padding: 9px 13px;
}
.game strong,
.game small {
  display: block;
}
.game[aria-pressed="true"] {
  background: #244b45;
  color: white;
  border-color: #244b45;
}
.game[aria-pressed="true"] small {
  color: #c4e2d4;
}
.workspace {
  display: grid;
  grid-template-columns: minmax(260px, 0.77fr) minmax(0, 1.65fr);
  gap: 14px;
  align-items: start;
}
aside,
#inspector {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 9px;
  min-width: 0;
}
aside {
  padding: 15px;
}
aside h2 {
  margin-bottom: 11px;
}
input,
select {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 5px;
  height: 35px;
  padding: 0 8px;
  min-width: 0;
}
input {
  width: 100%;
}
.filters {
  display: flex;
  gap: 6px;
  margin: 7px 0 12px;
}
.filters select {
  width: 50%;
}
#tree {
  overflow: auto;
  max-height: 75vh;
}
.group {
  display: block;
  font:
    700 10px/1.4 ui-monospace,
    monospace;
  color: var(--muted);
  margin: 12px 0 4px;
  font-size: 12px;
  overflow-wrap: anywhere;
}
.row {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 9px;
  min-height: 36px;
  padding: 7px 8px;
  text-align: left;
  background: transparent;
  border: 0;
  border-radius: 4px;
}
.row:hover {
  background: #f3f5f0;
}
.row[aria-current="true"] {
  background: var(--mint);
  color: #144f3b;
}
.row .title {
  overflow-wrap: anywhere;
  flex: 1;
}
.row time {
  white-space: nowrap;
  font:
    10px ui-monospace,
    monospace;
  color: var(--muted);
}
.dot {
  width: 8px;
  height: 8px;
  background: #82938d;
  border-radius: 50%;
  flex: none;
}
.dot.action {
  background: #17856a;
}
.dot.error {
  background: #bc4b39;
}
.dot.result {
  background: #ab7832;
}
.dot.wheel {
  background: #815d9a;
}
.dot.draft {
  background: #467fa1;
}
#inspector {
  padding: clamp(14px, 2vw, 28px);
  min-height: 470px;
}
#inspector h2 {
  font-size: clamp(20px, 2.1vw, 28px);
  margin: 5px 0 4px;
  overflow-wrap: anywhere;
}
.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  border-bottom: 1px solid var(--border);
  margin: 17px 0 13px;
}
.tabs button {
  background: none;
  border: 0;
  border-bottom: 3px solid transparent;
  padding: 8px;
  font-weight: 600;
}
.tabs button[aria-pressed="true"] {
  border-color: var(--green);
  color: var(--green);
}
.panel,
.notice {
  padding: 11px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  margin: 8px 0;
  background: #f8faf6;
}
.warn {
  background: #fff4d7;
  color: #674810;
}
.metrics,
.columns {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.metric {
  padding: 10px 13px;
  background: #eef5ef;
  border-radius: 5px;
}
.metric strong {
  display: block;
}
.metric small {
  display: block;
  margin-top: 3px;
}
.track {
  height: 11px;
  display: flex;
  background: #e0e5df;
  border-radius: 4px;
  overflow: hidden;
}
.segment {
  height: 100%;
  border: 0;
  padding: 0;
  min-width: 2px;
}
.list {
  list-style: none;
  padding: 0;
  margin: 0;
}
.list li {
  padding: 8px;
  border-bottom: 1px solid #e2e7e2;
  overflow-wrap: anywhere;
}
.chosen {
  background: var(--mint);
  font-weight: 650;
}
pre {
  max-height: 58vh;
  overflow: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: #192e30;
  color: #e6f1eb;
  border-radius: 6px;
  padding: 14px;
  font:
    12px/1.55 ui-monospace,
    monospace;
}
.raw summary {
  cursor: pointer;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.chip {
  background: #e9eee9;
  border-radius: 4px;
  padding: 3px 6px;
  overflow-wrap: anywhere;
  font-size: 12px;
}
.board {
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 10px;
  min-width: 0;
}
.lane {
  padding: 6px 0;
  border-bottom: 1px solid #e1e7df;
  overflow-wrap: anywhere;
}
.lane b {
  color: var(--green);
}
.wheelbar {
  height: 14px;
  background: #c9cec8;
  position: relative;
  border-radius: 2px;
  overflow: hidden;
  margin: 6px 0;
}
.sector,
.needle {
  position: absolute;
  height: 100%;
}
.sector.hit {
  background: #64b68a;
}
.sector.crit {
  background: #e5ad48;
}
.needle {
  width: 3px;
  background: #1e2328;
}
.legend {
  font-size: 12px;
  color: var(--muted);
}
.empty {
  padding: 24px 8px;
  color: var(--muted);
}
footer {
  padding: 18px 0 24px;
  font-size: 12px;
}
@media (max-width: 800px) {
  .workspace {
    grid-template-columns: 1fr;
  }
  #tree {
    max-height: 235px;
  }
  .game {
    min-width: 90px;
  }
  .summary {
    align-items: start;
    flex-direction: column;
    gap: 8px;
  }
  .privacy {
    font-size: 11px;
  }
  .columns {
    grid-template-columns: 1fr;
  }
}
#timeline {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 0 0 15px;
  flex-wrap: wrap;
}
#timeline .track {
  flex: 1;
  min-width: 180px;
  height: 23px;
}
.segment {
  color: white;
  font:
    600 11px ui-monospace,
    monospace;
  min-width: 18px;
  flex-basis: 0;
}
.seat-key {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 12px;
}
.seat-key span::before {
  display: inline-block;
  content: "";
  width: 10px;
  height: 10px;
  border-radius: 2px;
  margin-right: 5px;
  background: var(--seat-color);
}
[data-side="0"] { --seat-color: #276d59; }
[data-side="1"] { --seat-color: #77446c; }
.segment { background: var(--seat-color, #57666b); }
.segment:hover,
.segment[aria-pressed="true"] {
  box-shadow: inset 0 0 0 2px #172526;
}
.track:focus-within {
  overflow: visible;
}
.segment:focus-visible {
  outline-offset: 0;
}
</style></head>

    ),
  );
  head.append(side, el("span", "Organizer report", "privacy"));
  area.append(head);
  if (!end)
    $("notices").append(
      el("p", "Incomplete trace. The match result has yet to be recorded.", "notice warn"),
    );
  for (const message of payload.diagnostics)
    $("notices").append(el("p", message, "notice warn"));
}
function gameBar() {
  const area = $("games");
  area.replaceChildren();
  for (const g of games) {
    const result = completed.find((n) => n.game === g)?.event.data;
    const b = button("", "game", () => {
      game = g;
      selected = null;
      $("query").value = "";
      $("turn").value = "";
      refresh(true);
    });
    b.setAttribute("aria-pressed", String(game === g));
    b.append(
      el("strong", "Game " + g),
      el("small", result ? "Winner · " + playerName(result.winner) : "No result"),
    );
    area.append(b);
  }
}
function timeline() {
  const area = $("timeline");
  area.replaceChildren();
  const records = nodes.filter(
    (n) => n.game === game && Number.isFinite(n.event.ts),
  );
  const checkpoints = records.filter(
    (n) => n.event.type === "unity_state" && Number.isInteger(n.turn),
  );
  if (!checkpoints.length) return;
  const turns = [];
  for (const n of checkpoints) {
    if (turns.at(-1)?.turn !== n.turn || turns.at(-1)?.actor !== n.actor) turns.push(n);
  }
  // The last sample in the game ends the measured interval. A clock correction
  // can yield zero duration; never present a negative elapsed time.
  const last = records.at(-1).event.ts;
  const track = el("div", "", "track");
  area.append(
    el("div", "Turn durations · Game " + game, "kicker"),
    track,
  );
  for (let i = 0; i < turns.length; i++) {
    const n = turns[i];
    const span = Math.max(0, (turns[i + 1]?.event.ts ?? last) - n.event.ts);
    const name = turnLabel(n.turn, n.actor) + " · " + readableSeconds(span);
    const segment = button(n.turn === 0 ? "L" : String(n.turn), "segment", () => {
      $("turn").value = String(n.turn);
      $("query").value = "";
      $("kind").value = "";
      refresh();
    });
    segment.dataset.side = String(seats.indexOf(n.actor));
    segment.style.flexGrow = String(span);
    segment.title = name;
    segment.setAttribute("aria-label", name);
    segment.setAttribute(
      "aria-pressed",
      String($("turn").value === String(n.turn)),
    );
    track.append(segment);
  }
  const key = el("div", "", "seat-key");
  seats.forEach((seat, i) => {
    const label = el("span", playerName(seat));
    label.dataset.side = String(i);
    key.append(label);
  });
  area.append(
    key,
    el(
      "span",
      readableSeconds(last - turns[0].event.ts) +
        " from the first snapshot to the last event",
      "legend",
    ),
  );
}
function refresh(resetTurns = false) {
  gameBar();
  const query = $("query").value.trim().toLowerCase(),
    filter = $("kind").value;
  if (resetTurns) {
    const t = $("turn");
    t.replaceChildren(new Option("All turns", ""));
    const turns = new Map();
    for (const n of nodes) {
      if (n.game === game && n.turn != null && !turns.get(n.turn))
        turns.set(n.turn, n.actor);
    }
    for (const [number, actor] of turns)
      t.add(new Option(number === 0 ? "Landscape placement" : turnLabel(number, actor), String(number)));
  }
  timeline();
  const turn = $("turn").value;
  const visible = nodes.filter((n) => {
    if (n.game !== game || (turn && String(n.turn) !== turn)) return false;
    if (filter === "wheel") {
      if (
        n.event.type !== "act" ||
        !array(n.after?.events).some((v) => String(v).startsWith("wheel "))
      )
        return false;
    } else if (filter && filter !== "raw" && n.category !== filter)
      return false;
    if (
      !query &&
      filter !== "raw" &&
      ["public_events", "unity_state"].includes(n.event.type)
    )
      return false;
    if (
      query &&
      !(
        n.title + " " + n.group +
        " " +
        n.event.type +
        " " +
        JSON.stringify(n.event.data) +
        " " +
        JSON.stringify(n.event.data, (_, value) => names.get(value) ?? actionLabel(value)) +
        " " +
        JSON.stringify(array(n.after?.events).map(actionLabel))
      )
        .toLowerCase()
        .includes(query)
    )
      return false;
    return true;
  });
  if (!visible.includes(selected))
    selected =
      visible.find((n) => n.category === "action") ?? visible[0] ?? null;
  const tree = $("tree");
  tree.replaceChildren();
  let last = null;
  for (const n of visible) {
    if (n.group !== last) {
      tree.append(el("span", n.group, "group"));
      last = n.group;
    }
    const b = button("", "row", () => {
      selected = n;
      refresh();
    });
    b.setAttribute("aria-current", String(n === selected));
    b.append(
      el("span", "", "dot " + n.category),
      el("span", n.title, "title"),
      el("time", "#" + (n.event.seq ?? n.index + 1)),
    );
    tree.append(b);
  }
  if (!visible.length)
    tree.append(el("div", "No matching events.", "empty"));
  renderDetail(selected, seats);
}
$("kind").add(new Option("All raw records", "raw"));
$("query").placeholder = "Search this game…";
$("query").setAttribute("aria-label", "Search this game");
$("query").oninput = () => refresh();
$("kind").onchange = () => refresh();
$("turn").onchange = () => refresh();
overview();
refresh(true);
</script></body></html>
