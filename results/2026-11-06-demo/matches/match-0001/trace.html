<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>Match trace · Card Wars Arena</title><style>:root {
  --ink: #202c34;
  --muted: #57666b;
  --border: #cfd8d4;
  --paper: #f2f4ef;
  --white: #fff;
  --green: #146654;
  --mint: #d6ede1;
  --plum: #84486f;
  --gold: #ffcd64;
  color: var(--ink);
  font:
    14px/1.45 -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--paper);
}
button,
input,
select {
  font: inherit;
  color: inherit;
}
button,
select {
  cursor: pointer;
}
button:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 3px solid #1786a6;
  outline-offset: 2px;
}
.shell {
  max-width: 1440px;
  margin: auto;
  padding: 0 clamp(12px, 3.4vw, 52px);
}
header {
  background: #162e2e;
  color: white;
}
.mast {
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.mast b {
  letter-spacing: 0.09em;
  font-size: 13px;
}
.emblem {
  font-size: 23px;
  color: #acd9b1;
  margin-right: 6px;
}
.mast > span,
.slash {
  color: #accbc1;
}
.slash {
  margin: 0 6px;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1 {
  font-size: clamp(24px, 3.4vw, 46px);
  letter-spacing: -0.06em;
  font-weight: 650;
}
h2 {
  font-size: 20px;
  letter-spacing: -0.03em;
}
h3 {
  font-size: 14px;
  margin: 18px 0 8px;
}
.kicker {
  font:
    700 11px/1.5 ui-monospace,
    monospace;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--green);
}
#overview {
  padding: 27px 0 19px;
}
.summary {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 20px;
}
.score {
  color: var(--green);
  padding: 0 0.18em;
  font-variant-numeric: tabular-nums;
}
.sub,
.meta,
small,
footer {
  color: var(--muted);
}
.sub {
  margin-top: 5px;
}
.privacy {
  display: inline-block;
  border: 1px solid #a7bbb2;
  border-radius: 100px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 650;
}
#games {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin: 0 0 18px;
}
.game {
  flex: 1;
  min-width: 120px;
  background: #fafbf7;
  border: 1px solid var(--border);
  border-radius: 7px;
  text-align: left;
  padding: 9px 13px;
}
.game strong,
.game small {
  display: block;
}
.game[aria-pressed="true"] {
  background: #244b45;
  color: white;
  border-color: #244b45;
}
.game[aria-pressed="true"] small {
  color: #c4e2d4;
}
.workspace {
  display: grid;
  grid-template-columns: minmax(260px, 0.77fr) minmax(0, 1.65fr);
  gap: 14px;
  align-items: start;
}
aside,
#inspector {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 9px;
  min-width: 0;
}
aside {
  padding: 15px;
}
aside h2 {
  margin-bottom: 11px;
}
input,
select {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 5px;
  height: 35px;
  padding: 0 8px;
  min-width: 0;
}
input {
  width: 100%;
}
.filters {
  display: flex;
  gap: 6px;
  margin: 7px 0 12px;
}
.filters select {
  width: 50%;
}
#tree {
  overflow: auto;
  max-height: 75vh;
}
.group {
  display: block;
  font:
    700 10px/1.4 ui-monospace,
    monospace;
  color: var(--muted);
  margin: 12px 0 4px;
  font-size: 12px;
  overflow-wrap: anywhere;
}
.row {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 9px;
  min-height: 36px;
  padding: 7px 8px;
  text-align: left;
  background: transparent;
  border: 0;
  border-radius: 4px;
}
.row:hover {
  background: #f3f5f0;
}
.row[aria-current="true"] {
  background: var(--mint);
  color: #144f3b;
}
.row .title {
  overflow-wrap: anywhere;
  flex: 1;
}
.row time {
  white-space: nowrap;
  font:
    10px ui-monospace,
    monospace;
  color: var(--muted);
}
.dot {
  width: 8px;
  height: 8px;
  background: #82938d;
  border-radius: 50%;
  flex: none;
}
.dot.action {
  background: #17856a;
}
.dot.error {
  background: #bc4b39;
}
.dot.result {
  background: #ab7832;
}
.dot.wheel {
  background: #815d9a;
}
.dot.draft {
  background: #467fa1;
}
#inspector {
  padding: clamp(14px, 2vw, 28px);
  min-height: 470px;
}
#inspector h2 {
  font-size: clamp(20px, 2.1vw, 28px);
  margin: 5px 0 4px;
  overflow-wrap: anywhere;
}
.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  border-bottom: 1px solid var(--border);
  margin: 17px 0 13px;
}
.tabs button {
  background: none;
  border: 0;
  border-bottom: 3px solid transparent;
  padding: 8px;
  font-weight: 600;
}
.tabs button[aria-pressed="true"] {
  border-color: var(--green);
  color: var(--green);
}
.panel,
.notice {
  padding: 11px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  margin: 8px 0;
  background: #f8faf6;
}
.warn {
  background: #fff4d7;
  color: #674810;
}
.metrics,
.columns {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.metric {
  padding: 10px 13px;
  background: #eef5ef;
  border-radius: 5px;
}
.metric strong {
  display: block;
}
.metric small {
  display: block;
  margin-top: 3px;
}
.track {
  height: 11px;
  display: flex;
  background: #e0e5df;
  border-radius: 4px;
  overflow: hidden;
}
.segment {
  height: 100%;
  border: 0;
  padding: 0;
  min-width: 2px;
}
.list {
  list-style: none;
  padding: 0;
  margin: 0;
}
.list li {
  padding: 8px;
  border-bottom: 1px solid #e2e7e2;
  overflow-wrap: anywhere;
}
.chosen {
  background: var(--mint);
  font-weight: 650;
}
pre {
  max-height: 58vh;
  overflow: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: #192e30;
  color: #e6f1eb;
  border-radius: 6px;
  padding: 14px;
  font:
    12px/1.55 ui-monospace,
    monospace;
}
.raw summary {
  cursor: pointer;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.chip {
  background: #e9eee9;
  border-radius: 4px;
  padding: 3px 6px;
  overflow-wrap: anywhere;
  font-size: 12px;
}
.board {
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 10px;
  min-width: 0;
}
.lane {
  padding: 6px 0;
  border-bottom: 1px solid #e1e7df;
  overflow-wrap: anywhere;
}
.lane b {
  color: var(--green);
}
.wheelbar {
  height: 14px;
  background: #c9cec8;
  position: relative;
  border-radius: 2px;
  overflow: hidden;
  margin: 6px 0;
}
.sector,
.needle {
  position: absolute;
  height: 100%;
}
.sector.hit {
  background: #64b68a;
}
.sector.crit {
  background: #e5ad48;
}
.needle {
  width: 3px;
  background: #1e2328;
}
.legend {
  font-size: 12px;
  color: var(--muted);
}
.empty {
  padding: 24px 8px;
  color: var(--muted);
}
footer {
  padding: 18px 0 24px;
  font-size: 12px;
}
@media (max-width: 800px) {
  .workspace {
    grid-template-columns: 1fr;
  }
  #tree {
    max-height: 235px;
  }
  .game {
    min-width: 90px;
  }
  .summary {
    align-items: start;
    flex-direction: column;
    gap: 8px;
  }
  .privacy {
    font-size: 11px;
  }
  .columns {
    grid-template-columns: 1fr;
  }
}
#timeline {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 0 0 15px;
  flex-wrap: wrap;
}
#timeline .track {
  flex: 1;
  min-width: 180px;
  height: 23px;
}
.segment {
  color: white;
  font:
    600 11px ui-monospace,
    monospace;
  min-width: 18px;
  flex-basis: 0;
}
.seat-key {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 12px;
}
.seat-key span::before {
  display: inline-block;
  content: "";
  width: 10px;
  height: 10px;
  border-radius: 2px;
  margin-right: 5px;
  background: var(--seat-color);
}
[data-side="0"] { --seat-color: #276d59; }
[data-side="1"] { --seat-color: #77446c; }
.segment { background: var(--seat-color, #57666b); }
.segment:hover,
.segment[aria-pressed="true"] {
  box-shadow: inset 0 0 0 2px #172526;
}
.track:focus-within {
  overflow: visible;
}
.segment:focus-visible {
  outline-offset: 0;
}
</style></head>

\u0442\u044c! (seat 0, lane 3)":"Tap a creature to attack! (seat 0, lane 4)"}}}</script><script>// The inspector reads the selected organizer event; all trace strings are rendered as text.
window.renderDetail = function renderDetail(node, seats) {
  const root = document.getElementById("inspector");
  root.replaceChildren();
  if (!node) {
    root.append(el("p", "Select a timeline event.", "empty"));
    return;
  }
  const {event, before, after} = node;
  const data = event.data ?? {};
  const seatName = id => playerName(seats[id] ?? id);
  const name = id => id == null ? "—" : cardName(id);
  const stage = turn => turn === 0 ? "Landscape placement" : "Turn " + String(turn ?? "—");
  const show = value => value == null ? "—" : String(value);
  const block = (tag, text, cls) => el(tag, text, cls);
  const list = values => {
    const ul = block("ul", "", "list");
    for (const v of values) ul.append(block("li", String(v)));
    return ul;
  };
  const chips = values => {
    const row = block("div", "", "chips");
    for (const v of values) row.append(block("span", String(v), "chip"));
    return row;
  };
  const events = event.type === "public_events" ? array(data) : array(after?.events);
  const wheelLines = events.filter(s => typeof s === "string" && s.startsWith("wheel "));
  const isAct = event.type === "act";
  const options = array((isAct ? before : after ?? before)?.actions);
  const reasons = {health: "Hero health reached zero", deck_timeout: "Deck selection timed out",
    turn_timeout: "Turn timed out", retry_same_opening: "Restarted with the same opening position"};
  const reasonText = reason => reasons[reason] ?? show(reason);

  root.append(block("div", node.group, "kicker"), block("h2", node.title),
    block("p", [atTime(event.ts), "#" + event.seq, event.type].join(" · "), "meta"));
  const tabs = block("nav", "", "tabs");
  tabs.setAttribute("aria-label", "Event details");
  const content = block("div", "", "inspector-body");
  root.append(tabs, content);

  function roster(group, p) {
    const pane = block("div", "", "panel");
    pane.append(block("strong", playerName(p.seat ?? group)), block("p", "Hero · " + name(p.hero)));
    if (Array.isArray(p.cards)) pane.append(block("h3", "Deck · " + p.cards.length), chips(p.cards.map(name)));
    const tiles = p.required_landscapes ?? p.landscapes;
    if (Array.isArray(tiles)) pane.append(block("h3", "Landscapes"), chips(tiles));
    return pane;
  }
  function summary() {
    if ((isAct || event.type === "submit_deck") && data.comment) {
      content.append(block("h3", "Player comment"), block("p", data.comment, "panel"));
    }
    if (isAct) {
      content.append(chips([playerName(data.seat), stage(data.turn), "Revision " + show(data.revision)]));
      if (before && after) {
        const changes = seats.map((s, i) => playerName(s) + " · HP " + show(before.hp?.[i]) + " → " + show(after.hp?.[i]));
        content.append(block("h3", "After the action"), chips(changes));
      }
      if (events.length) content.append(list(events.map(actionLabel)));
    } else if (event.type === "submit_deck") {
      content.append(roster(data.seat, data));
    } else if (event.type === "opening") {
      content.append(block("p", "First player · " + seatName(data.first) + " · Starting health · " + show(data.health), "panel"));
      for (const p of array(data.players)) content.append(roster(p.seat, p));
    } else if (event.type === "match_start") {
      content.append(chips(["Seed " + show(data.seed), "Starting HP " + show(data.health), ...array(data.seats).map(playerName)]));
      if (data.pool) content.append(block("h3", "Shared pool · " + data.pool.length), chips(data.pool.map(name)));
      if (data.heroes) content.append(block("h3", "Heroes"), chips(data.heroes.map(name)));
    } else if (event.type === "game_end") {
      content.append(block("p", "Winner · " + playerName(data.winner), "panel"), block("p", reasonText(data.reason)));
      content.append(chips(["Turns · " + show(data.turns), ...array(data.hp).map((h, i) => seatName(i) + " · HP " + h)]));
    } else if (event.type === "match_end") {
      content.append(list(Object.entries(data).map(([s, n]) => playerName(s) + " · " + n + " wins")));
    } else if (event.type === "timeout") {
      const phase = data.phase === "select_deck" ? "deck selection" : show(data.phase);
      content.append(block("p", "Time expired · " + playerName(data.seat) + " · " + phase, "notice warn"),
        chips(["Deadline · " + atTime(data.deadline), "Observed · " + atTime(data.observed_at)]));
    } else if (event.type === "run_interrupted" || event.type === "run_resumed" || node.category === "error") {
      content.append(block("p", reasonText(typeof data === "string" ? data : data.reason ?? data.message), "notice warn"));
    } else if (event.type === "public_events") {
      content.append(list(events.map(actionLabel)));
    } else if (event.type === "unity_state") {
      content.append(chips([stage(data.turn), "Revision " + show(data.revision),
        "Active player · " + seatName(data.active), "Available actions · " + array(data.actions).length]));
      if (events.length) content.append(list(events.map(actionLabel)));
    } else if (event.type === "draft_start") {
      content.append(block("p", "Choose a hero and twenty cards for game " + event.game + ".", "panel"));
    } else {
      content.append(block("pre", JSON.stringify(data, null, 2)));
    }
  }
  function choices() {
    if (!options.length) {
      content.append(block("p", "No actions were available in this state.", "empty"));
      return;
    }
    const ul = block("ul", "", "list");
    for (const choice of options) {
      const picked = isAct && choice.id === data.engine_id;
      const li = block("li", "", picked ? "chosen" : "");
      li.append(block("span", (picked ? "Selected · " : "") + actionLabel(choice.label ?? choice.id)),
        block("small", "  " + choice.id));
      ul.append(li);
    }
    content.append(ul);
  }
  function snapshot(state) {
    if (!state) {
      content.append(block("p", "This trace has no snapshot for this state.", "empty"));
      return;
    }
    content.append(block("p", stage(state.turn) + " · Revision " + show(state.revision)
      + " · Active player · " + seatName(state.active), "meta"));
    const columns = block("div", "", "columns");
    for (const side of array(state.board)) {
      const i = side.seat;
      const col = block("section", "", "board");
      col.append(block("h3", seatName(i)), block("p", name(side.hero)),
        chips(["HP " + show(state.hp?.[i]), "Mana · " + show(side.mp), "Spell mana · " + show(side.spellMP),
          "Ability cooldown · " + show(side.heroCooldown), "Cards in deck · " + show(side.deckCount)]));
      for (const lane of array(side.lanes)) {
        const row = block("div", "", "lane");
        const flags = [lane.flipped && "flipped", lane.disabled && "blocked"].filter(Boolean);
        row.append(block("b", "Lane " + (lane.lane + 1) + " · " + (lane.landscape === "None" ? "empty" : show(lane.landscape))));
        if (flags.length) row.append(block("small", " · " + flags.join(", ")));
        const c = lane.creature;
        if (c) {
          const conditions = [c.flooped && "flooped", c.cantAttack && "cannot attack", c.protected && "protected",
            c.helpless && "helpless", c.floopBlocked && "floop blocked"].filter(Boolean);
          row.append(block("p", name(c.id) + " · attack " + show(c.attack) + " · HP " + show(c.hp)
            + (c.maxHP == null ? "" : "/" + c.maxHP) + (conditions.length ? " · " + conditions.join(", ") : "")));
        }
        if (lane.building) row.append(block("p", "Building · " + name(lane.building)));
        col.append(row);
      }
      const hand = array(state.hands?.[i]);
      col.append(block("h3", "Hand · " + hand.length), chips(hand.map(name)));
      columns.append(col);
    }
    content.append(columns);
  }
  function wheel() {
    for (const line of wheelLines) {
      const panel = block("div", "", "panel");
      const fields = Object.fromEntries(Array.from(line.matchAll(/(\w+)=([^ ]+)/g), m => [m[1], m[2]]));
      panel.append(block("strong", seatName(fields.seat) + " · Lane " + (Number(fields.lane) + 1)
        + " · " + (fields.mode === "defense" ? "Defense" : "Attack") + " · " + show(fields.result)));
      const bar = block("div", "", "wheelbar");
      const addSector = (x, y, cls) => {
        const sector = block("span", "", cls);
        sector.style.left = (x * 100) + "%";
        sector.style.width = ((y - x) * 100) + "%";
        bar.append(sector);
      };
      for (const key of ["hit", "crit"]) {
        const range = /^\[([-\d.]+),([-\d.]+)\]$/.exec(fields[key] ?? "");
        if (!range) continue;
        const [x, y] = range.slice(1).map(Number);
        if (![x,y].every(v => Number.isFinite(v) && v >= 0 && v <= 1)) continue;
        if (x <= y) addSector(x, y, "sector " + key);
        else { addSector(x, 1, "sector " + key); addSector(0, y, "sector " + key); }
      }
      const stop = Number(fields.stop);
      if (Number.isFinite(stop) && stop >= 0 && stop <= 1) {
        const needle = block("span", "", "needle");
        needle.style.left = (100 * stop) + "%";
        bar.append(needle);
      }
      panel.append(bar, block("p", "Green indicates a hit. Gold indicates a critical hit. "
        + (fields.stop === "forced" ? "The engine forced this result." : "The marker shows where the wheel stopped."), "legend"),
        block("pre", line));
      content.append(panel);
    }
  }
  const entries = [["Overview", summary]];
  if (isAct || options.length) entries.push(["Choices · " + options.length, choices]);
  if (before) entries.push(["Before", () => snapshot(before)]);
  if (after) entries.push(["After", () => snapshot(after)]);
  if (wheelLines.length) entries.push(["Wheel · " + wheelLines.length, wheel]);
  entries.push(["JSON", () => content.append(block("pre", JSON.stringify(event, null, 2)))]);
  function select(button, draw) {
    for (const b of tabs.children) b.setAttribute("aria-pressed", String(b === button));
    content.replaceChildren();
    draw();
  }
  for (const [label, draw] of entries) {
    const button = block("button", label);
    button.type = "button";
    button.setAttribute("aria-pressed", "false");
    button.addEventListener("click", () => select(button, draw));
    tabs.append(button);
  }
  select(tabs.children[0], summary);
};

const $ = (id) => document.getElementById(id);
const array = (v) => (Array.isArray(v) ? v : []);
function el(tag, text = "", cls = "") {
  const element = document.createElement(tag);
  if (text != null) element.textContent = String(text);
  if (cls) element.className = cls;
  return element;
}
const payload = JSON.parse($("trace-data").textContent);
const events = payload.events;
const start = events.find((e) => e.type === "match_start")?.data ?? {};
const seats = array(start.seats).length ? start.seats : ["A", "B"];
const playerName = (seat) => start.display_names?.[seat] ?? start.identities?.[seat] ?? seat ?? "unknown player";
const names = new Map(Object.entries(payload.display.names));
const labels = new Map(Object.entries(payload.display.labels));
const actionLabel = (label) => labels.get(label) ?? label;
const cardName = (id) => names.get(id) ?? String(id ?? "—");
const atTime = (ts) =>
  Number.isFinite(ts) && Math.abs(ts) < 8.64e12
    ? new Date(ts * 1000).toISOString().slice(11, 23) + " UTC"
    : "Time unknown";
const titles = {
  match_start: "Match start",
  draft_start: "Deck selection",
  opening: "Opening position",
  game_end: "Game result",
  match_end: "Match result",
  run_interrupted: "Run interrupted",
  run_resumed: "Run resumed",
  timeout: "Time expired",
  public_events: "Board events",
  unity_state: "Board state",
};
const nodes = [];
function turnLabel(turn, actor) {
  return (turn === 0 ? "Landscape placement" : "Turn " + turn) + " · " + playerName(actor);
}
function readableSeconds(seconds) {
  if (!Number.isFinite(seconds)) return "—";
  const value = Math.max(0, seconds);
  return value >= 60
    ? Math.floor(value / 60) + "m " + Math.floor(value % 60) + "s"
    : value.toFixed(1) + "s";
}
const states = new Map(),
  pending = new Map();
for (const event of events) {
  const d = event.data ?? {},
    game = String(event.game ?? "—"),
    type = event.type;
  if (
    ["opening", "run_interrupted", "run_resumed", "game_end"].includes(type)
  ) {
    states.delete(game);
    pending.delete(game);
  }
  let turn = d.turn ?? states.get(game)?.turn ?? null;
  let title = titles[type] ?? type;
  let category = "event";
  if (type === "act") {
    title = actionLabel(d.label ?? d.engine_id ?? "Action");
    category = "action";
  }
  if (type === "submit_deck") title = "Deck · " + playerName(d.seat);
  if (["draft_start", "submit_deck", "opening"].includes(type)) {
    category = "draft";
    turn = null;
  }
  if (["match_end", "game_end"].includes(type)) {
    category = "result";
    turn = null;
  }
  if (/interrupt|resum|error|timeout|reject|fail/.test(type))
    category = "error";
  const state = type === "unity_state" ? d : states.get(game);
  const actor = type === "act" ? d.seat :
    state?.turn === turn ? seats[state.active] : null;
  const node = {
    event,
    game,
    turn,
    title,
    category,
    actor,
    before: null,
    after: null,
    group: "Game " + game + (turn != null ? " / " + turnLabel(turn, actor) : ""),
    index: nodes.length,
  };
  if (type === "unity_state") {
    const action = pending.get(game);
    if (
      action &&
      Number.isInteger(action.event.data?.revision) &&
      d.revision === action.event.data.revision + 1
    )
      action.after = d;
    pending.delete(game);
    states.set(game, d);
    node.after = d;
  } else if (type === "act") {
    const prior = states.get(game);
    if (prior && prior.revision === d.revision) node.before = prior;
    pending.set(game, node);
  }
  nodes.push(node);
}
const games = [...new Set(nodes.map((n) => n.game))];
const completed = nodes.filter((n) => n.event.type === "game_end");
const end = nodes.findLast((n) => n.event.type === "match_end")?.event.data;
let game = games[0] ?? "",
  selected = null;
function button(text, cls, fn) {
  const b = el("button", text, cls);
  b.type = "button";
  b.onclick = fn;
  return b;
}
function overview() {
  const area = $("overview");
  area.append(el("div", "Match trace", "kicker"));
  const head = el("div", "", "summary"),
    side = el("div"),
    title = el("h1");
  title.append(
    document.createTextNode(playerName(seats[0]) + " "),
    el(
      "span",
      end ? (end[seats[0]] ?? "—") + " : " + (end[seats[1]] ?? "—") : " · ",
      "score",
    ),
    document.createTextNode(" " + playerName(seats[1])),
  );
  side.append(
    title,
    el(
      "p",
      [
        String(start.match_id ?? payload.source),
        completed.length + " games completed",
        nodes.filter((n) => n.category === "action").length + " decisions",
        events.length + " events",
      ].join("  ·  "),
      "sub",
    ),
  );
  head.append(side, el("span", "Organizer report", "privacy"));
  area.append(head);
  if (!end)
    $("notices").append(
      el("p", "Incomplete trace. The match result has yet to be recorded.", "notice warn"),
    );
  for (const message of payload.diagnostics)
    $("notices").append(el("p", message, "notice warn"));
}
function gameBar() {
  const area = $("games");
  area.replaceChildren();
  for (const g of games) {
    const result = completed.find((n) => n.game === g)?.event.data;
    const b = button("", "game", () => {
      game = g;
      selected = null;
      $("query").value = "";
      $("turn").value = "";
      refresh(true);
    });
    b.setAttribute("aria-pressed", String(game === g));
    b.append(
      el("strong", "Game " + g),
      el("small", result ? "Winner · " + playerName(result.winner) : "No result"),
    );
    area.append(b);
  }
}
function timeline() {
  const area = $("timeline");
  area.replaceChildren();
  const records = nodes.filter(
    (n) => n.game === game && Number.isFinite(n.event.ts),
  );
  const checkpoints = records.filter(
    (n) => n.event.type === "unity_state" && Number.isInteger(n.turn),
  );
  if (!checkpoints.length) return;
  const turns = [];
  for (const n of checkpoints) {
    if (turns.at(-1)?.turn !== n.turn || turns.at(-1)?.actor !== n.actor) turns.push(n);
  }
  // The last sample in the game ends the measured interval. A clock correction
  // can yield zero duration; never present a negative elapsed time.
  const last = records.at(-1).event.ts;
  const track = el("div", "", "track");
  area.append(
    el("div", "Turn durations · Game " + game, "kicker"),
    track,
  );
  for (let i = 0; i < turns.length; i++) {
    const n = turns[i];
    const span = Math.max(0, (turns[i + 1]?.event.ts ?? last) - n.event.ts);
    const name = turnLabel(n.turn, n.actor) + " · " + readableSeconds(span);
    const segment = button(n.turn === 0 ? "L" : String(n.turn), "segment", () => {
      $("turn").value = String(n.turn);
      $("query").value = "";
      $("kind").value = "";
      refresh();
    });
    segment.dataset.side = String(seats.indexOf(n.actor));
    segment.style.flexGrow = String(span);
    segment.title = name;
    segment.setAttribute("aria-label", name);
    segment.setAttribute(
      "aria-pressed",
      String($("turn").value === String(n.turn)),
    );
    track.append(segment);
  }
  const key = el("div", "", "seat-key");
  seats.forEach((seat, i) => {
    const label = el("span", playerName(seat));
    label.dataset.side = String(i);
    key.append(label);
  });
  area.append(
    key,
    el(
      "span",
      readableSeconds(last - turns[0].event.ts) +
        " from the first snapshot to the last event",
      "legend",
    ),
  );
}
function refresh(resetTurns = false) {
  gameBar();
  const query = $("query").value.trim().toLowerCase(),
    filter = $("kind").value;
  if (resetTurns) {
    const t = $("turn");
    t.replaceChildren(new Option("All turns", ""));
    const turns = new Map();
    for (const n of nodes) {
      if (n.game === game && n.turn != null && !turns.get(n.turn))
        turns.set(n.turn, n.actor);
    }
    for (const [number, actor] of turns)
      t.add(new Option(number === 0 ? "Landscape placement" : turnLabel(number, actor), String(number)));
  }
  timeline();
  const turn = $("turn").value;
  const visible = nodes.filter((n) => {
    if (n.game !== game || (turn && String(n.turn) !== turn)) return false;
    if (filter === "wheel") {
      if (
        n.event.type !== "act" ||
        !array(n.after?.events).some((v) => String(v).startsWith("wheel "))
      )
        return false;
    } else if (filter && filter !== "raw" && n.category !== filter)
      return false;
    if (
      !query &&
      filter !== "raw" &&
      ["public_events", "unity_state"].includes(n.event.type)
    )
      return false;
    if (
      query &&
      !(
        n.title + " " + n.group +
        " " +
        n.event.type +
        " " +
        JSON.stringify(n.event.data) +
        " " +
        JSON.stringify(n.event.data, (_, value) => names.get(value) ?? actionLabel(value)) +
        " " +
        JSON.stringify(array(n.after?.events).map(actionLabel))
      )
        .toLowerCase()
        .includes(query)
    )
      return false;
    return true;
  });
  if (!visible.includes(selected))
    selected =
      visible.find((n) => n.category === "action") ?? visible[0] ?? null;
  const tree = $("tree");
  tree.replaceChildren();
  let last = null;
  for (const n of visible) {
    if (n.group !== last) {
      tree.append(el("span", n.group, "group"));
      last = n.group;
    }
    const b = button("", "row", () => {
      selected = n;
      refresh();
    });
    b.setAttribute("aria-current", String(n === selected));
    b.append(
      el("span", "", "dot " + n.category),
      el("span", n.title, "title"),
      el("time", "#" + (n.event.seq ?? n.index + 1)),
    );
    tree.append(b);
  }
  if (!visible.length)
    tree.append(el("div", "No matching events.", "empty"));
  renderDetail(selected, seats);
}
$("kind").add(new Option("All raw records", "raw"));
$("query").placeholder = "Search this game…";
$("query").setAttribute("aria-label", "Search this game");
$("query").oninput = () => refresh();
$("kind").onchange = () => refresh();
$("turn").onchange = () => refresh();
overview();
refresh(true);
</script></body></html>
