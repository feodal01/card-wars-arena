name: Publish match viewers

on:
  push:
    branches: [main]
    paths:
      - 'results/**/trace.html'
      - .github/workflows/trace-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: results
      - run: |
          find results -name trace.html | while IFS= read -r trace; do
            target="public/${trace%/trace.html}"
            mkdir -p "$target"
            cp "$trace" "$target/index.html"
          done
          cp results/2026-11-10-human-terra/trace.html public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
