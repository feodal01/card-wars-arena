<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>{{TITLE}} · Card Wars Arena</title><style>{{CSS}}</style></head>
<body data-mode="{{MODE}}"><header><a class="wordmark" href="#" aria-label="Card Wars Arena">CARD WARS <b>ARENA</b></a><span id="matchup"></span><button id="rules">Rules</button></header>
<main><div class="heading"><div><span class="over" id="eyeline"></span><h1 id="heading">{{TITLE}}</h1></div><span id="clock"></span></div>
<p id="notice" role="status" hidden></p>
<section id="draft"><div class="work"><nav class="tabs"><button id="cardsTab">Cards</button><button id="heroesTab">Heroes</button></nav><div class="filters"><input id="search" type="search" placeholder="Search names or abilities" aria-label="Search names or abilities"><select id="faction" aria-label="Faction"><option value="">All factions</option></select><select id="kind" aria-label="Card type"><option value="">All types</option><option>Creature</option><option>Spell</option><option>Building</option></select></div><p class="quiet" id="count"></p><div class="grid" id="library"></div></div>
<aside><div id="draftDetail"></div><div class="panel"><h2>Your deck <span id="deckCount"></span></h2><div id="chosen"></div><div id="roster"></div><div class="controls"><button id="export">Export deck</button><label class="button">Import deck<input type="file" accept="application/json,.json" id="import"></label></div><label id="recordOption" hidden><input type="checkbox" id="recordVideo" checked> Record match video</label><button id="start" class="primary wide" hidden>Start match</button><p id="startHint" class="quiet"></p></div></aside></section>
<section id="battle" hidden><div class="work"><div id="board"></div><h2>Your hand <span id="handCount"></span></h2><div class="grid hand" id="hand"></div><details><summary>Battle log</summary><ol id="events"></ol></details></div><aside><div id="battleDetail"></div><div class="panel"><h2>Actions</h2><div id="actions"></div></div></aside></section>
<div id="waiting" class="panel" hidden></div></main>
<dialog id="guide"><button id="closeRules" class="right">Close</button><h2>Game rules</h2><div id="guideText"></div></dialog>
<script id="data" type="application/json">{{DATA}}</script><script>{{JS}}</script></body></html>
